name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (tauri-plugin-updater verifies this
          # against the public key embedded in tauri.conf.json) — see
          # SECURITY.md and CONTRIBUTING.md for how this key was generated
          # and why it must never be committed. tauri-action wants the raw
          # key content here, not a file path.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Croco ${{ github.ref_name }}'
          releaseBody: |
            ## Croco 2.0.1

            **Terminal (`croco`)**
            - Full-screen, responsive layout: centred command bar, live panels (todos, numbered projects, completion rate) and a status bar.
            - Follows the desktop theme; on the Default theme the Croco logo is light green by day and light blue at night.
            - `cmd <project>` opens a command prompt inside a project (`home` / `exit` to leave, `cmd <other>` to switch). Long-running commands stream live and `Ctrl+C` stops them.
            - Projects are numbered and the number works everywhere: `open 1`, `cmd 2`, `git 3 status`.
            - Create, edit, complete and delete todos; git and GitHub (`gh`) commands from the prompt.

            See 2.0.0 below for the rest of the 2.0 feature set.

            Windows is the supported platform for this release; macOS/Linux builds are provided as-is and untested.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          args: ${{ matrix.args }}

  # The matrix jobs upload into one *draft* release (so a half-built release
  # is never visible and `latest.json` is never served with missing
  # platforms). Only once every platform built is the draft published, which
  # is what makes /releases/latest/download/latest.json — the updater
  # endpoint — start resolving to this version.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
