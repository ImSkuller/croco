[package]
name = "croco-cli"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Croco in your terminal — a Claude Code-style interface to your projects, todos and notes"
publish = false

[[bin]]
name = "croco"
path = "src/main.rs"

[dependencies]
crossterm  = "0.29"
serde_json = "1"
chrono     = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid       = { version = "1", features = ["v4"] }
dirs       = "6"
rusqlite   = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
